name: temporary-ci
on:
  push:
    branches: [fix/stable-funnel-fastmcp4]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile server.py
      - name: Import and start server
        shell: bash
        run: |
          export GH_CLIENT_ID=test
          export GH_CLIENT_SECRET=test
          export ALLOWED_GITHUB_USERS=Satianurag
          export MCP_BASE_URL=https://pc-shell.example.com
          export MCP_JWT_SIGNING_KEY=test-only-ci-signing-key-with-enough-entropy-123456789
          export MCP_STORAGE_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export MCP_OAUTH_DIR="$RUNNER_TEMP/oauth"
          python -c 'import server; print(type(server.mcp).__name__)'
          python server.py >"$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          code=000
          for i in {1..30}; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/mcp || true)"
            [[ "$code" != 000 ]] && break
            sleep 0.2
          done
          kill "$pid" || true
          wait "$pid" || true
          cat "$RUNNER_TEMP/server.log"
          [[ "$code" != 000 ]]
